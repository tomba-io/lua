name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lua-version: ['5.1', '5.3', '5.4']

    name: Lua ${{ matrix.lua-version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua${{ matrix.lua-version }} liblua${{ matrix.lua-version }}-dev luarocks

      - name: Install dependencies
        run: |
          sudo luarocks install luasocket
          sudo luarocks install md5
          sudo luarocks install lua-cjson
          sudo luarocks install busted
          sudo luarocks install --deps-mode none lua-requests

      - name: Patch lua-requests to make xml optional
        run: |
          REQUESTS_FILE=$(find /usr/local/share/lua -name "requests.lua" 2>/dev/null | head -1)
          if [ -n "$REQUESTS_FILE" ]; then
            sudo sed -i "s/local xml = require('xml')/local ok_xml, xml = pcall(require, 'xml')/" "$REQUESTS_FILE"
          fi

      - name: Run tests
        run: busted tests/
        env:
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET_KEY: ${{ secrets.TOMBA_SECRET_KEY }}

  lint:
    runs-on: ubuntu-latest
    name: Luacheck

    steps:
      - uses: actions/checkout@v5

      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

      - name: Install luacheck
        run: sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck tomba/ tests/
