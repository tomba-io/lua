name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lua-version: ['5.1', '5.3', '5.4']

    name: Lua ${{ matrix.lua-version }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua${{ matrix.lua-version }} liblua${{ matrix.lua-version }}-dev luarocks

      - name: Install dependencies
        run: |
          luarocks install --local luasocket
          luarocks install --local md5
          luarocks install --local lua-cjson
          luarocks install --local busted
          luarocks install --local --deps-mode none lua-requests

      - name: Run tests
        run: |
          eval $(luarocks path --bin)
          busted tests/
        env:
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET_KEY: ${{ secrets.TOMBA_SECRET_KEY }}

  lint:
    runs-on: ubuntu-latest
    name: Luacheck

    steps:
      - uses: actions/checkout@v5

      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

      - name: Install luacheck
        run: luarocks install --local luacheck

      - name: Run luacheck
        run: |
          eval $(luarocks path --bin)
          luacheck tomba/ tests/
