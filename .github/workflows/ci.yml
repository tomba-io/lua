name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lua-version: ['5.1', '5.3', '5.4', 'luajit-2.1']

    name: Lua ${{ matrix.lua-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install dependencies
        run: |
          luarocks install lua-requests
          luarocks install lua-cjson
          luarocks install busted

      - name: Run tests
        run: busted tests/
        env:
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET_KEY: ${{ secrets.TOMBA_SECRET_KEY }}

  lint:
    runs-on: ubuntu-latest
    name: Luacheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck tomba/ tests/
